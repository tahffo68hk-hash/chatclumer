<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>配对</title></head>
<body style="font:14px/1.4 sans-serif;width:280px;padding:12px">
<p>只连接本机 127.0.0.1:43124。不会读取 Cookie。元宝、智谱等站点要在绑定当前页时单独授权，才会注册内容脚本。授权不等于已经核实正文位置。</p>
<p id="service">本机服务：正在检查…</p>
<label>配对码<br><input id="code" style="width:100%"></label>
<button id="pair" type="button">配对</button>
<p id="paired">扩展配对：还没有。</p>
<label>选择成员<br><select id="member-pick" style="width:100%"></select></label>
<details>
<summary>手动填写（一般不用）</summary>
<label>成员 ID<br><input id="member" style="width:100%"></label>
<label>标签页绑定键<br><input id="tabkey" style="width:100%"></label>
</details>
<button id="bind" type="button">绑定当前标签页</button>
<p id="status"></p>
<hr>
<p style="margin:6px 0"><b>页面检查</b>（只找元素，不写入、不点击）</p>
<button id="health" type="button">检查当前页</button>
<button id="dump" type="button">导出诊断快照</button>
<pre id="health-out" style="white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto"></pre>
<hr>
<p style="margin:6px 0"><b>适配器注册表</b></p>
<p id="registry" style="font-size:12px"></p>
<label>远端地址（https，填 off 关闭）<br><input id="registry-url" style="width:100%"></label>
<button id="registry-save" type="button">保存并检查更新</button>
<script src="popup.js"></script>
</body>
</html>
